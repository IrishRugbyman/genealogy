# ATTENTION - ce fichier n'est PAS celui que nginx sert.
#
# /etc/nginx/sites-enabled/genealogy est un fichier ORDINAIRE, pas un lien
# symbolique vers celui-ci, et certbot y a ajoute son propre bloc `listen 443
# ssl`. Editer ce fichier-ci ne change donc rien en production : il faut
# reporter la modification a la main dans sites-enabled, puis
#     sudo nginx -t && sudo systemctl reload nginx
#
# Ce decalage a coute une soiree le 2026-08-17 : le bloc /api/uploads ci-dessous
# etait ici mais pas en service, donc client_max_body_size restait au defaut de
# 1 Mo et le premier vrai depot de la famille a ete refuse par un 413 avant meme
# d'atteindre l'application. Le correctif a ete applique dans sites-enabled ;
# sauvegarde de l'ancienne version dans /etc/nginx/backups/.
#
# Ne jamais laisser une sauvegarde dans sites-enabled/ : nginx charge TOUS les
# fichiers du repertoire, et un .bak provoque un "conflicting server name".
server {
    listen 80;
    server_name genealogy.lbzgiu.xyz;

    # Compression
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # The one upload route. Everything else on this vhost is a GET of a few kB,
    # so the body limit and the timeouts are raised here only: a batch of
    # full-resolution scans from /depot can be a couple of hundred MB on a slow
    # domestic uplink.
    location = /api/uploads {
        client_max_body_size 260m;
        client_body_timeout  600s;
        proxy_request_buffering on;

        proxy_pass         http://127.0.0.1:8005;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API proxy
    location /api/ {
        proxy_pass         http://127.0.0.1:8005;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Interactive docs (FastAPI /docs and /redoc)
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass       http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Placeholder root until the frontend is built (Phase 4)
    root /home/lbzgiu/genealogy/app/frontend/dist;
    index index.html;

    # The SPA shell is revalidated on every load, or a browser keeps running an
    # old build for days after a deploy (it guesses a lifetime from
    # Last-Modified when no Cache-Control is sent). Every route falls back here
    # through try_files, so this covers them all. The hashed files under
    # /assets/ never change under one name and can be kept for a year.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
